<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9a94" />
    <title>Agenda odontológica</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d9a94'/%3E%3Cpath d='M22 14c-6 0-10 5-10 11 0 5 3 8 4 12 1 5 1 11 3 15 1 3 4 3 5 0 2-4 2-9 5-9s3 5 5 9c1 3 4 3 5 0 2-4 2-10 3-15 1-4 4-7 4-12 0-6-4-11-10-11-4 0-5 2-7 2s-3-2-7-2z' fill='white'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <div class="app">
      <aside class="lateral" aria-label="Navegación principal">
        <div class="marca">
          <div class="marca-logo" id="logo"></div>
          <div>
            <strong>Agenda odontológica</strong>
            <span>Gestión dinámica de citas</span>
          </div>
        </div>
        <nav class="nav" id="nav-lateral"></nav>
        <div class="lateral-pie">
          <strong id="pie-icono"></strong>
          Las horas estimadas se recalculan solas cuando la agenda se retrasa.
          <div class="estado-api"><span class="punto" id="punto-api"></span><span id="texto-api">Conectando…</span></div>
        </div>
      </aside>

      <main class="principal" id="principal" tabindex="-1">
        <div class="contenido" id="contenido"></div>      </main>
    </div>

    <nav class="barra-movil" id="nav-movil" aria-label="Navegación principal"></nav>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
